<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background-color: #0f172a; /* Fondo oscuro inicial para contraste */
            transition: background-color 1s ease;
        }

        .title-font {
            font-family: 'Dancing Script', cursive;
        }

        /* Animación del regalo latiendo */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-heartbeat {
            animation: heartbeat 1.5s infinite;
        }

        /* Animación de la llama de la vela */
        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            50% { transform: scale(1.1) rotate(2deg); opacity: 1; }
            25%, 75% { transform: scale(0.9) rotate(0deg); opacity: 0.8; }
        }
        .flame-active {
            animation: flicker 0.2s infinite alternate;
            transform-origin: bottom center;
        }

        /* Globos flotando */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.8;
            animation: floatUp 10s linear infinite;
            z-index: 0;
        }
        .balloon::before {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 5px 10px 5px;
            border-color: transparent transparent inherit transparent;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -50px;
            left: 50%;
            width: 2px;
            height: 50px;
            background: rgba(255,255,255,0.4);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-50vh) rotate(5deg); }
            100% { transform: translateY(-120vh) rotate(-5deg); }
        }

        /* Efecto de transición entre pantallas */
        .fade-out {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
            transition: all 0.8s ease-out;
        }
        .fade-in {
            opacity: 1;
            transform: scale(1);
            transition: all 0.8s ease-out;
        }

        /* Tarjeta Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(107, 33, 168, 0.37); /* Sombra morada */
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Animación para el Modo Arcoíris */
        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rainbow-background {
            background: linear-gradient(45deg, #7e22ce, #db2777, #ea580c, #eab308, #22c55e, #3b82f6, #a855f7, #db2777);
            background-size: 300% 300%;
            animation: rainbow-bg 8s ease infinite;
        }
    </style>
</head>
<body class="text-white min-h-screen">

    <canvas id="confetti-canvas"></canvas>

    <div id="intro-screen" class="fixed inset-0 flex flex-col items-center justify-center z-50 bg-slate-900 transition-all duration-700">
        <h1 class="text-3xl md:text-5xl font-bold mb-10 text-purple-300 text-center px-4 animate-pulse">
            Alguien te dejó una sorpresa...
        </h1>
        
        <button id="open-gift-btn" class="relative group cursor-pointer border-none bg-transparent outline-none">
            <!-- Icono de Regalo (SVG) -->
            <div class="animate-heartbeat transform transition-transform group-hover:scale-110 group-active:scale-95">
                <svg width="200" height="200" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 10V20C20 20.5523 19.5523 21 19 21H5C4.44772 21 4 20.5523 4 20V10" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 7H22" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 7V21" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 7H16.5C17.8807 7 19 5.88071 19 4.5C19 3.11929 17.8807 2 16.5 2C15.1193 2 12 7 12 7Z" fill="#E9D5FF" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 7H7.5C6.11929 7 5 5.88071 5 4.5C5 3.11929 6.11929 2 7.5 2C8.88071 2 12 7 12 7Z" fill="#E9D5FF" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <p class="mt-6 text-xl font-semibold text-purple-200 opacity-80 group-hover:opacity-100 transition-opacity">
                ¡Toca para abrir!
            </p>
        </button>
    </div>

    <div id="party-screen" class="hidden min-h-screen relative overflow-hidden bg-gradient-to-br from-indigo-950 via-purple-900 to-fuchsia-900 py-12 px-4 opacity-0 transform scale-95 transition-all duration-1000">
        
        <!-- Contenedor de globos (se generan con JS) -->
        <div id="balloons-container" class="absolute inset-0 pointer-events-none"></div>

        <div class="max-w-3xl mx-auto relative z-10 flex flex-col items-center">
            
            <!-- Título Principal y Foto -->
            <div class="text-center mb-12">
                <div class="relative w-32 h-32 md:w-40 md:h-40 mx-auto mb-6 group cursor-pointer">
                    <!-- Efecto de brillo detrás de la foto -->
                    <!-- <div class="absolute inset-[-4px] bg-gradient-to-r from-purple-500 via-fuchsia-500 to-indigo-500 rounded-full blur-md opacity-75 group-hover:opacity-100 transition-opacity duration-300 animate-pulse"></div> -->
                    <!-- Imagen (Puedes cambiar el link de src por la foto real) -->
                    <!-- <img src="image.png" alt="Foto de la cumpleañera" class="relative w-full h-full object-cover rounded-full border-4 border-indigo-900 z-10 group-hover:scale-105 transition-transform duration-300"> -->
                </div>

                <h2 class="text-2xl md:text-3xl font-light text-purple-200 tracking-widest mb-2 uppercase">¡Llegó tu día!</h2>
                <!-- EDITA EL NOMBRE AQUÍ -->
                <h1 class="title-font text-6xl md:text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-fuchsia-300 to-indigo-300 drop-shadow-[0_0_15px_rgba(168,85,247,0.5)]">
                    ¡Feliz Cumple, Lesly🥮!
                </h1>
            </div>

            <!-- Sección Interactiva del Pastel y Tulipanes -->
            <div class="mb-12 flex flex-col items-center">
                <p id="wish-text" class="text-xl text-yellow-200 mb-6 font-semibold animate-pulse">¡Pide un deseo y apaga la vela! 👇</p>
                
                <div class="flex items-end justify-center space-x-4">
                    <!-- Tulipán Izquierdo -->
                    <div class="hidden md:block mb-4">
                        <svg width="60" height="100" viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Tallo -->
                            <path d="M50 80 Q 40 120 45 150" stroke="#22C55E" stroke-width="4" fill="none"/>
                            <!-- Hoja -->
                            <path d="M48 110 Q 20 100 30 70 Q 40 100 48 110" fill="#22C55E"/>
                            <!-- Flor (Morada) -->
                            <path d="M30 40 Q 30 10 50 20 Q 70 10 70 40 Q 70 80 50 80 Q 30 80 30 40 Z" fill="#9333EA"/>
                            <path d="M40 30 Q 50 10 60 30 Q 55 70 50 70 Q 45 70 40 30 Z" fill="#A855F7"/>
                        </svg>
                    </div>

                    <button id="cake-btn" class="relative group cursor-pointer focus:outline-none transform transition-transform hover:scale-105">
                        <!-- SVG Pastel -->
                        <svg width="150" height="150" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Plato -->
                            <ellipse cx="50" cy="90" rx="45" ry="10" fill="#E2E8F0"/>
                            <!-- Base del pastel (Morado oscuro) -->
                            <path d="M15 85V60C15 54.4772 30.67 50 50 50C69.33 50 85 54.4772 85 60V85C85 90.5228 69.33 95 50 95C30.67 95 15 90.5228 15 85Z" fill="#7E22CE"/>
                            <!-- Decoración capa inferior -->
                            <path d="M15 70C25 75 35 65 45 70C55 75 65 65 75 70C80 72.5 85 70 85 70" stroke="#581C87" stroke-width="4" stroke-linecap="round"/>
                            <!-- Capa superior del pastel (Morado claro) -->
                            <path d="M25 60V40C25 34.4772 36.1929 30 50 30C63.8071 30 75 34.4772 75 40V60C75 65.5228 63.8071 70 50 70C36.1929 70 25 65.5228 25 60Z" fill="#D8B4FE"/>
                            <!-- Fresas / Decoración arriba (Morado más intenso) -->
                            <circle cx="35" cy="35" r="4" fill="#9333EA"/>
                            <circle cx="50" cy="32" r="4" fill="#9333EA"/>
                            <circle cx="65" cy="35" r="4" fill="#9333EA"/>
                            <!-- Vela -->
                            <rect x="47" y="15" width="6" height="15" rx="2" fill="#FEF08A"/>
                            <path d="M47 18L53 22" stroke="#EAB308" stroke-width="1"/>
                            <path d="M47 22L53 26" stroke="#EAB308" stroke-width="1"/>
                            <!-- Llama -->
                            <path id="flame" class="flame-active" d="M50 5C50 5 46 10 46 13C46 15.2091 47.7909 17 50 17C52.2091 17 54 15.2091 54 13C54 10 50 5 50 5Z" fill="#F97316"/>
                            <path id="flame-inner" class="flame-active" d="M50 8C50 8 48 11 48 13C48 14.1046 48.8954 15 50 15C51.1046 15 52 14.1046 52 13C52 11 50 8 50 8Z" fill="#FDE047"/>
                        </svg>
                    </button>

                    <!-- Tulipán Derecho -->
                    <div class="hidden md:block mb-4 transform scale-x-[-1]">
                        <svg width="60" height="100" viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Tallo -->
                            <path d="M50 80 Q 40 120 45 150" stroke="#22C55E" stroke-width="4" fill="none"/>
                            <!-- Hoja -->
                            <path d="M48 110 Q 20 100 30 70 Q 40 100 48 110" fill="#22C55E"/>
                            <!-- Flor (Morada) -->
                            <path d="M30 40 Q 30 10 50 20 Q 70 10 70 40 Q 70 80 50 80 Q 30 80 30 40 Z" fill="#9333EA"/>
                            <path d="M40 30 Q 50 10 60 30 Q 55 70 50 70 Q 45 70 40 30 Z" fill="#C084FC"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Tarjeta de Mensaje (Glassmorphism) -->
            <div class="glass-panel rounded-3xl p-8 md:p-12 w-full shadow-2xl relative">
                <!-- Chincheta decorativa (Morada) -->
                <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 w-8 h-8 bg-purple-500 rounded-full shadow-md border-4 border-purple-300"></div>
                
                <h3 class="title-font text-3xl md:text-4xl mb-6 text-purple-200 border-b border-purple-300/30 pb-4">
                    Para ti con cariño 💜
                </h3>
                
                <div id="message-container" class="text-lg md:text-xl text-gray-100 leading-relaxed space-y-4 min-h-[150px]">
                    <!-- El texto aparecerá aquí con efecto máquina de escribir -->
                </div>
            </div>

            <!-- Botón Sorpresa Arcoíris -->
            <div class="mt-8 flex flex-col items-center opacity-0 transition-opacity duration-1000" id="rainbow-section">
                <p class="text-sm text-purple-300 mb-3 text-center italic">"Como me dijiste que te gustan todos los colores..."</p>
                <button id="rainbow-btn" class="px-8 py-3 bg-gradient-to-r from-red-500 via-yellow-500 to-blue-500 rounded-full text-white font-bold hover:scale-110 transition-transform shadow-[0_0_15px_rgba(234,179,8,0.5)] border-2 border-white/50">
                    ¡Activar Modo Arcoíris! 🌈
                </button>
            </div>

        </div>
    </div>

    <script>
        // Referencias a elementos
        const introScreen = document.getElementById('intro-screen');
        const partyScreen = document.getElementById('party-screen');
        const openGiftBtn = document.getElementById('open-gift-btn');
        
        const cakeBtn = document.getElementById('cake-btn');
        const flame = document.getElementById('flame');
        const flameInner = document.getElementById('flame-inner');
        const wishText = document.getElementById('wish-text');
        const balloonsContainer = document.getElementById('balloons-container');

        // Colores para los globos y confeti (Tonos morados, fucsias y dorados)
        const partyColors = ['#9333EA', '#A855F7', '#C084FC', '#E879F9', '#FBBF24', '#7E22CE'];

        // 1. Abrir el regalo y transicionar de pantalla
        openGiftBtn.addEventListener('click', () => {
            // Efecto de desaparecer la primera pantalla
            introScreen.classList.add('fade-out');
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                partyScreen.classList.remove('hidden');
                
                // Un pequeño delay para que la transición sea fluida
                setTimeout(() => {
                    partyScreen.classList.remove('opacity-0', 'scale-95');
                    partyScreen.classList.add('opacity-100', 'scale-100');
                    
                    // Disparar confeti inicial
                    fireConfetti(100);
                    // Crear globos de fondo
                    createBalloons(15);
                    
                    // Iniciar efecto máquina de escribir después de 1 segundo
                    setTimeout(typeWriterEffect, 1000);
                }, 100);

            }, 800); // Esperar a que termine la animación css
        });

        const messageLines = [
            "¡Habla mana! 🎉 No se si recuerdas la pagina del año pasado por tu cumpleaños fueron unos tulipanes, para este quería hacerte algo especial, así que te programé esta pequeña sorpresa.",
            "Espero que pases un día increíble, rodeada de la gente que te quiere (yo incluido obvio). Que este nuevo año de vida te traiga un montón de cosas buenas, viajes, risas y que cumplas todos esos sueños que tienes.",
            "Con mucho cariño, <br><span class='font-semibold text-purple-300'>Rosmer ✨</span>"
        ];
        
        function typeWriterEffect() {
            const container = document.getElementById('message-container');
            container.innerHTML = '';
            let lineIndex = 0;
            let charIndex = 0;
            
            function type() {
                if (lineIndex < messageLines.length) {
                    if (charIndex === 0) {
                        const p = document.createElement('p');
                        if (lineIndex === messageLines.length - 1) {
                            p.className = "text-right mt-6"; 
                        }
                        container.appendChild(p);
                    }
                    
                    const currentP = container.lastElementChild;
                    
                    if (messageLines[lineIndex].includes('<br>')) {
                         currentP.innerHTML = messageLines[lineIndex];
                         lineIndex++;
                         charIndex = 0;
                         setTimeout(type, 500);
                    } else {
                        currentP.innerHTML += messageLines[lineIndex].charAt(charIndex);
                        charIndex++;
                        if (charIndex < messageLines[lineIndex].length) {
                            setTimeout(type, 40); 
                        } else {
                            lineIndex++;
                            charIndex = 0;
                            setTimeout(type, 800); 
                        }
                    }
                } else {
                    // Aparecer el botón mágico EXACTAMENTE cuando termina el texto
                    const rainbowSection = document.getElementById('rainbow-section');
                    rainbowSection.classList.remove('opacity-0');
                    rainbowSection.classList.add('opacity-100');
                }
            }
            type();
        }

        // 2. Lógica de apagar la vela
        let isCandleBlown = false;
        cakeBtn.addEventListener('click', () => {
            if (!isCandleBlown) {
                isCandleBlown = true;
                
                // Apagar llama (remover clases de animación y ocultar)
                flame.classList.remove('flame-active');
                flameInner.classList.remove('flame-active');
                flame.style.display = 'none';
                flameInner.style.display = 'none';
                
                // Cambiar texto
                wishText.textContent = "¡Deseo concedido! 🥳✨";
                wishText.classList.remove('animate-pulse');
                wishText.classList.add('text-purple-300', 'scale-110', 'transition-transform');
                
                // ¡Súper explosión de confeti!
                fireConfetti(250);
            } else {
                // Si vuelve a dar click, tirar más confeti por diversión
                fireConfetti(50);
            }
        });

        // 3. Generador de Globos de fondo
        function createBalloons(amount) {
            for (let i = 0; i < amount; i++) {
                const balloon = document.createElement('div');
                balloon.classList.add('balloon');
                
                // Asignar color aleatorio
                const color = partyColors[Math.floor(Math.random() * partyColors.length)];
                balloon.style.backgroundColor = color;
                balloon.style.borderColor = color;
                
                // Posición horizontal aleatoria
                balloon.style.left = `${Math.random() * 100}vw`;
                
                // Retraso y duración aleatoria para que no suban todos juntos
                balloon.style.animationDuration = `${10 + Math.random() * 10}s`;
                balloon.style.animationDelay = `${Math.random() * 5}s`;
                
                // Tamaño ligeramente variable
                const scale = 0.7 + Math.random() * 0.6;
                balloon.style.transform = `scale(${scale})`;

                balloonsContainer.appendChild(balloon);
            }
        }

        // 4. Motor de Confeti (Física en Canvas)
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticles(count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: canvas.width / 2, // Salen del centro
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 30 - 15, // Propagación horizontal
                    dy: Math.random() * -25 - 10, // Propagación hacia arriba
                    color: partyColors[Math.floor(Math.random() * partyColors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0,
                    gravity: 0.5 + Math.random() * 0.5
                });
            }
        }

        function drawConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = 0;

            particles.forEach((p, index) => {
                if (p.y < canvas.height) { // Solo dibujar y calcular si está en pantalla
                    activeParticles++;
                    p.tiltAngle += p.tiltAngleInc;
                    p.dy += p.gravity; // Gravedad
                    p.y += p.dy;
                    p.x += p.dx + Math.sin(p.tiltAngle) * 2; // Viento/Movimiento oscilante

                    // Frenar expansión horizontal lentamente
                    p.dx *= 0.98;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                }
            });

            if (activeParticles > 0) {
                animationId = requestAnimationFrame(drawConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles = []; // Limpiar memoria
            }
        }

        function fireConfetti(amount) {
            createParticles(amount);
            if (!animationId || particles.length <= amount) { // Evitar múltiples loops si ya está corriendo
                cancelAnimationFrame(animationId);
                drawConfetti();
            }
        }

        // 5. Lógica del Botón Arcoíris
        const rainbowBtn = document.getElementById('rainbow-btn');
        const rainbowSection = document.getElementById('rainbow-section');
        const mainTitle = document.querySelector('h1.title-font');

        rainbowBtn.addEventListener('click', () => {
            // Cambiar el fondo por el animado de arcoíris
            partyScreen.classList.remove('from-indigo-950', 'via-purple-900', 'to-fuchsia-900', 'bg-gradient-to-br');
            partyScreen.classList.add('rainbow-background');
            
            // Añadir TODOS los colores a la lista de confeti
            partyColors.push('#EF4444', '#F97316', '#EAB308', '#22C55E', '#3B82F6', '#EC4899');
            
            // Cambiar los colores del título
            mainTitle.classList.remove('from-purple-300', 'via-fuchsia-300', 'to-indigo-300');
            mainTitle.classList.add('from-red-400', 'via-yellow-300', 'to-blue-400');
            
            // Explotar confeti arcoíris
            fireConfetti(300);
            
            // Cambiar texto del botón
            rainbowBtn.innerHTML = "¡A disfrutar! ✨";
            rainbowBtn.disabled = true;
            rainbowBtn.classList.remove('hover:scale-110', 'cursor-pointer');
        });

    </script>
</body>
</html>
